[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opencalcs"
version = "0.1.0"
description = "Modular engineering calculation host and API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.11,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27,<0.29",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/opencalcs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
